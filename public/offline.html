<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>오프라인 | 최부장 비밀 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; display: grid; place-items: center; }
    main { max-width: 560px; padding: 32px 20px; }
    p { color: #bfd0e5; line-height: 1.6; }
    button { font-size: 15px; border-radius: 8px; border: none; padding: 10px 14px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>자료실은 서버가 로그인과 기기 승인을 확인해야 열립니다. 오프라인에서는 메모를 보여 주지 않으며, 이 기기에는 메모나 기기 키를 저장해 두지 않습니다.</p>
    <p>네트워크에 다시 연결한 뒤 새로고침하면 로그인과 기기 승인부터 다시 진행합니다.</p>
    <button onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
